<!doctype html><html lang="it"><meta charset="utf-8"><style>* { box-sizing:border-box; margin:0; padding:0 } body { background:#fff; font-family:Calibri,sans-serif; color:#1F1E1D; padding:0.1cm }

.f::before { position:absolute; left:0.2cm; top:0.12cm; font:bold 11pt "Segoe UI Symbol" }

</style>
