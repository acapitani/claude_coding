<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>/claude ✻ Coding — copertina di stampa</title>
<!--
  Copertina di stampa distesa (Pixartprinting, brossura fresata): 4ª di copertina | dorso | 1ª di copertina.
  La genera build/build_stampa.py, che passa i parametri nella query string:
    dorso=<mm>   larghezza del dorso (calcolata dal numero di pagine, vedi book.yaml → stampa)
    w, h, b      rifilato e abbondanza in mm (predefiniti: 148, 210, 3)
    retro=<json> titolo e paragrafi del retro (da assets/copertina/retro.json)
  Il fronte è la copertina digitale (cover.html) ridotta: un solo disegno per le due copertine.
  Loghi _kap (_kaplogo/): usati così come sono, senza deformarli né ricolorarli; il ritaglio toglie
  solo il margine trasparente del file. Fondo scuro → «Wordmark — scuro» e monogramma.
-->
<style>
  :root {
    --fondo: #1F1E1D; --crema: #F0EEE6; --crema-tenue: #B8B2A7; --arancio: #D77757; --filo: #4A4643;
    --w: 148mm; --h: 210mm; --b: 3mm; --d: 11.2mm;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @page { margin: 0; }
  html, body { width: calc(2 * var(--b) + 2 * var(--w) + var(--d)); height: calc(2 * var(--b) + var(--h)); }
  body {
    background: var(--fondo); color: var(--crema); position: relative; overflow: hidden;
    font-family: "DejaVu Sans Mono", Consolas, monospace;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .pannello { position: absolute; top: 0; height: 100%; }

  /* ---------- 4ª di copertina ---------- */
  .retro {
    left: 0; width: calc(var(--b) + var(--w));
    background: radial-gradient(ellipse 120mm 90mm at 60% 35%, #2B2927 0%, var(--fondo) 70%);
  }
  .retro .contenuto {        /* 14 mm dai tagli esterni, 16 mm dalla piega del dorso */
    position: absolute; left: calc(var(--b) + 14mm); right: 16mm;
    top: calc(var(--b) + 13mm); bottom: calc(var(--b) + 40mm);
    display: flex; flex-direction: column;
  }
  .retro .testo-retro { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .retro .fascia {
    display: flex; justify-content: space-between; align-items: center;
    font-family: Calibri, "Segoe UI", sans-serif; font-size: 7.5pt; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--crema-tenue);
    border-bottom: 0.6pt solid var(--filo); padding-bottom: 2.2mm;
  }
  .retro .fascia .g { color: var(--arancio); letter-spacing: 0; font-family: "DejaVu Sans Mono"; }
  .retro h1 {
    font-family: "DejaVu Sans Mono", monospace; font-weight: bold; font-size: 15pt; line-height: 1.3;
    color: var(--crema); margin-bottom: 7mm;
  }
  .retro h1 .p { color: var(--arancio); }
  .retro p {
    font-family: Calibri, "Segoe UI", sans-serif; font-size: 11.5pt; line-height: 1.45;
    color: var(--crema); margin-bottom: 3.6mm; hyphens: manual;
  }
  .retro p.voce { padding-left: 4mm; text-indent: -4mm; margin-bottom: 1.2mm; }
  .retro p.voce + p:not(.voce) { margin-top: 3mm; }
  .retro .stella { color: var(--arancio); font-family: "DejaVu Sans Mono"; }
  .retro .piede {
    position: absolute; left: calc(var(--b) + 14mm); right: 16mm; bottom: calc(var(--b) + 11mm);
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 0.6pt solid var(--filo); padding-top: 4mm;
  }
  .retro .piede .firma {
    font-family: Calibri, "Segoe UI", sans-serif; font-size: 8pt; letter-spacing: 0.08em;
    color: var(--crema-tenue); text-align: right; line-height: 1.5;
  }
  .retro .piede .firma b { color: var(--crema); font-weight: normal; font-size: 11pt; letter-spacing: 0.04em; }

  /* ---------- logo: ritaglio del solo margine trasparente (bbox misurato sul PNG) ---------- */
  .logo { position: relative; overflow: hidden; }
  .logo img { position: absolute; display: block; }
  /* Wordmark 880×560 px, parte visibile 433×222 px a partire da (228, 180) */
  .wordmark { width: var(--lw); height: calc(var(--lw) * 222 / 433); }
  .wordmark img { width: calc(var(--lw) * 880 / 433); left: calc(var(--lw) * -228 / 433); top: calc(var(--lw) * -180 / 433); }
  /* Monogramma 512×512 px, parte visibile 400×400 px a partire da (56, 56) */
  .monogramma { width: var(--lw); height: var(--lw); }
  .monogramma img { width: calc(var(--lw) * 512 / 400); left: calc(var(--lw) * -56 / 400); top: calc(var(--lw) * -56 / 400); }

  /* ---------- dorso: si legge dall'alto verso il basso ---------- */
  .dorso { left: calc(var(--b) + var(--w)); width: var(--d); }
  .dorso .testo {
    position: absolute; left: 0; right: 0; top: calc(var(--b) + 14mm); bottom: calc(var(--b) + 26mm);
    writing-mode: vertical-rl; display: flex; align-items: center; justify-content: space-between;
    white-space: nowrap;
  }
  .dorso .titolo { font-family: "DejaVu Sans Mono", monospace; font-weight: bold; font-size: 12pt; color: var(--crema); }
  .dorso .titolo .slash { color: var(--crema-tenue); }
  .dorso .titolo .stella { color: var(--arancio); }
  .dorso .autore { font-family: Calibri, "Segoe UI", sans-serif; font-size: 10.5pt; letter-spacing: 0.06em; color: var(--crema); }
  .dorso .marchio { position: absolute; left: 50%; bottom: calc(var(--b) + 12mm); transform: translateX(-50%); --lw: 7.6mm; }

  /* ---------- 1ª di copertina: la copertina digitale, ridotta ---------- */
  .fronte { left: calc(var(--b) + var(--w) + var(--d)); width: calc(var(--w) + var(--b)); }
  .fronte iframe {
    position: absolute; left: 0; border: 0; width: 170mm; height: 240mm;
    top: calc(var(--b) + (var(--h) - 240mm * var(--scala)) / 2);
    transform: scale(var(--scala)); transform-origin: 0 0;
  }
  .fronte .marchio { position: absolute; left: 13.9mm; bottom: calc(var(--b) + 10.6mm); --lw: 25mm; }
</style>
</head>
<body>
  <section class="pannello retro">
    <div class="contenuto">
      <div class="fascia"><span>/claude <span class="g">✻</span> Coding</span><span>Autobiografia · Guida pratica</span></div>
      <div class="testo-retro">
        <h1 id="titolo"></h1>
        <div id="paragrafi"></div>
      </div>
    </div>
    <div class="piede">
      <div class="logo wordmark" style="--lw: 34mm"><img src="../../_kaplogo/Wordmark%20%E2%80%94%20scuro@1x.png" alt="_kap"></div>
      <div class="firma">scritto da<br><b>Claude Code</b><br>«Tratto da un prompt di Andrea Capitani»</div>
    </div>
  </section>

  <section class="pannello dorso">
    <div class="testo">
      <span class="titolo"><span class="slash">/</span>claude <span class="stella">✻</span> Coding</span>
      <span class="autore">Claude Code</span>
    </div>
    <div class="logo monogramma marchio"><img src="../../_kaplogo/Monogramma%20avatar@1x.png" alt="_kap"></div>
  </section>

  <section class="pannello fronte">
    <iframe src="cover.html?stampa=1" title="copertina"></iframe>
    <div class="logo wordmark marchio"><img src="../../_kaplogo/Wordmark%20%E2%80%94%20scuro@1x.png" alt="_kap"></div>
  </section>

<script>
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  const w = num("w", 148), h = num("h", 210), b = num("b", 3), d = num("dorso", 11.2);
  const r = document.documentElement.style;
  r.setProperty("--w", w + "mm"); r.setProperty("--h", h + "mm");
  r.setProperty("--b", b + "mm"); r.setProperty("--d", d + "mm");
  r.setProperty("--scala", String(w / 170));          // il fronte digitale è largo 170 mm

  const retro = q.has("retro") ? JSON.parse(q.get("retro")) : {
    titolo: "Testo del retro", paragrafi: ["(passato da build/build_stampa.py)"] };
  const stella = s => s.replace(/✻/g, '<span class="stella">✻</span>');
  // apostrofo tipografico come nel libro
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/'/g, "’");
  document.getElementById("titolo").innerHTML = '<span class="p">&gt;</span> ' + stella(esc(retro.titolo));
  document.getElementById("paragrafi").innerHTML = retro.paragrafi.map(p =>
    p.startsWith("· ") ? `<p class="voce">${stella(esc(p))}</p>` : `<p>${stella(esc(p))}</p>`).join("");
</script>
</body>
</html>
