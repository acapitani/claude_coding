# Metadati e ordine dei sorgenti del libro "/claude ✻ Coding".
# Letto da build/build_book.py. I file non ancora scritti vengono saltati con un avviso.
metadati:
  titolo: "/claude ✻ Coding"
  titolo_righe: ["/claude", "✻ Coding"]
  autore: "Claude Code"
  citazione_copertina: "«Tratto da un prompt di Andrea Capitani»"
  lingua: "it-IT"
  soggetto: "Autobiografia e guida pratica di Claude Code"
  parole_chiave: ["Claude Code", "intelligenza artificiale", "programmazione", "automazione d'ufficio"]
  colore_accento: "#D77757"   # confermato in S1 (research/note/spinner.md)

pagina:
  larghezza_cm: 17
  altezza_cm: 24
  margini_cm: {interno: 2.2, esterno: 1.8, superiore: 2.0, inferiore: 2.2}
  pagine_min: 160
  pagine_max: 200
  pagine_obiettivo: 180

output: claude-coding
copertina: assets/copertina/cover.png

# Voci speciali: frontespizio (generato dai metadati), indice (indice generale), crediti
# (Appendice generata da assets/CREDITI.md), indice-analitico. Le altre voci sono file in capitoli/.
cartella_capitoli: capitoli
indice_livelli: 2

preliminari:            # numerazione romana
  - frontespizio
  - 00-colophon         # sul retro del frontespizio
  - 00-dedica
  - indice
  - 00-prefazione

parti:                  # numerazione araba da qui
  - titolo: "Le origini"
    apertura: capitoli/parte-1.md
    capitoli: [01-da-dove-vengo, 02-la-nascita, 03-il-lancio, 04-crescere-in-pubblico]
  - titolo: "Primi passi insieme"
    apertura: capitoli/parte-2.md
    capitoli: [05-installazione, 06-la-prima-sessione, 07-come-parlarmi, 08-claude-md-e-la-memoria, 09-permessi-e-sicurezza]
  - titolo: "Costruire applicazioni"
    apertura: capitoli/parte-3.md
    capitoli: [10-dal-requisito-al-prototipo, 11-test-e-debug, 12-git-e-revisione, 13-un-progetto-completo]
  - titolo: "L’ufficio automatico"
    apertura: capitoli/parte-4.md
    capitoli: [14-documenti, 15-fogli-di-calcolo, 16-pdf, 17-file-e-cartelle, 18-report-periodici, 19-script-riutilizzabili]
  - titolo: "Superpoteri"
    apertura: capitoli/parte-5.md
    capitoli: [20-slash-command-e-skill, 21-hook, 22-sottoagenti, 23-mcp-e-connettori, 24-plugin-e-headless]
  - titolo: "Io, oggi"
    apertura: capitoli/parte-6.md
    capitoli: [25-dove-sono-adesso, 26-cosa-ho-imparato]

appendici:
  - app-a-comandi
  - app-b-glossario
  - app-c-risorse
  - crediti             # Appendice D, generata da assets/CREDITI.md
  - indice-analitico

# --- Stampa (Pixartprinting) ------------------------------------------------------------------
# Valori misurati sul template scaricato con il preventivo (print-template/, locale e non versionato):
# libro con copertina flessibile, brossura fresata, A5. L'interno è il PDF 17 × 24 ridotto in A5.
# Comando: py build/build_stampa.py  →  output/stampa/
stampa:
  stampatore: Pixartprinting
  prodotto: "Libro con copertina flessibile, brossura fresata"
  rifilato_mm: [148, 210]          # A5
  abbondanza_mm: 3                 # su ogni lato, interno e copertina
  area_sicura_mm: 5                # dal taglio (linea rossa del template)
  testi_consigliati_mm: {interno: 15, esterno: 10}   # istruzioni, punto 5
  fascia_colla_mm: 3               # bianca ai lati del dorso, nella copertina interna
  pagine_preventivo: 196           # pagine interne del preventivo e del template
  dorso_template_mm: 11.2          # pieghe del template a 151,0 e 162,2 mm
  spessore_foglio_mm: 0.11429      # calibrato: 11,2 mm / 98 fogli (stessa carta del preventivo)
  prima_pagina_pdf: 3              # l'interno parte dal frontespizio: copertina e suo retro esclusi
  verso_dorso: "alto-basso"        # testo del dorso leggibile dall'alto verso il basso
  profilo_icc: build/icc/Coated_Fogra39L_VIGC_300.icc   # Fogra 39 (registro ICC), non versionato
  corpo_minimo_pt: 6
  tratto_minimo_pt: 0.25
  risoluzione_min_dpi: 300
  copertina: assets/copertina/cover-stampa.html
  retro: assets/copertina/retro.json

varianti:
  stampa:                          # py build/update_indexes.py --variante stampa
    output: claude-coding-stampa
    tipografia:
      inchiostro: "#000000"        # nero puro → solo K dopo la conversione in CMYK
      testatina_pt: 9              # maiuscoletto ≥ 6 pt anche dopo la riduzione in A5 (× 0,8706)
    pagina:
      margini_cm: {testatina: 1.2} # testatina a 10,4 mm dal taglio dopo la riduzione
